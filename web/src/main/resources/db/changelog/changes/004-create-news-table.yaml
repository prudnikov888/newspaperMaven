databaseChangeLog:
  - changeSet:
      id: 004-create-news-table
      author: prudnikov888@gmail.com
      changes:
        - createTable:
            tableName: news
            columns:
              - column:
                  name: news_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: title4ann
                  type: VARCHAR(255)
              - column:
                  name: author
                  type: VARCHAR(255)
              - column:
                  name: post_day
                  type: VARCHAR(255)
              - column:
                  name: main_text
                  type: TINYTEXT
              - column:
                  name: user
                  type: INT
              - column:
                  name: category
                  type: INT
  - changeSet:
      id: 004-news-fk-user
      author: prudnikov888@gmail.com
      changes:
        - addForeignKeyConstraint:
            baseTableName: news
            baseColumnNames: user
            constraintName: fk_news_user
            referencedTableName: users
            referencedColumnNames: user_id
  - changeSet:
      id: 004-news-fk-category
      author: prudnikov888@gmail.com
      changes:
        - addForeignKeyConstraint:
            baseTableName: news
            baseColumnNames: category
            constraintName: fk_news_category
            referencedTableName: category
            referencedColumnNames: category_id
