<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Авторизация</title>
</head>
<body>
<div layout:fragment="header"></div>
<div layout:fragment="content">
    <small>Введите свои email и пароль для доступа к системе</small>
    <br/><br/>

    <p th:if="${param.error}" style="color:red">Неверный email или пароль.</p>

    <form th:action="@{/login}" method="post">
        <table>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="username" placeholder="Введите ваш email" size="40"/></td>
            </tr>
            <tr>
                <td>Пароль:</td>
                <td><input type="password" name="password" placeholder="Введите ваш пароль" size="40"/></td>
            </tr>
            <tr>
                <td></td>
                <td align="right"><input type="submit" value="Login" size="30"/></td>
            </tr>
        </table>
    </form>
</div>
</body>
</html>
