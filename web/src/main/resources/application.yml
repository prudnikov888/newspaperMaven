spring:
  application:
    name: newspaperSpring
  messages:
    basename: i18n/messages
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/newspaper?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    admin:
      # Only used once, on startup, to bootstrap the first admin row into the `users`
      # table (see AdminUserInitializer) - optional now that login is DB-backed via
      # UsersService, not in-memory. Generate the hash locally with
      # `new BCryptPasswordEncoder().encode("your-password")` and never commit it.
      username: ${ADMIN_USERNAME:}
      password-hash: ${ADMIN_PASSWORD_HASH:}

logging:
  level:
    org.hibernate.SQL: debug
